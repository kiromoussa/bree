# Door-less camera (aisle, cooler, counter overhead, corner view): the whole view is one zone, so the metrics are traffic
# (visits per hour), dwell in view and a heatmap. No entries/exits (the camera sees no door), no staff zone.
# Replace the zone polygon with real aisle/shelf zones once a person has looked at the camera.
station: trumanrd
camera: aisle_view
ref_size: [1280, 720]
zones:
  - {name: view, kind: aisle, polygon: [[0, 0], [1280, 0], [1280, 720], [0, 720]]}
