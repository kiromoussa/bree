[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bree-vision"
version = "0.1.0"
description = "BREE store vision: cashierless checkout + theft detection from the same event pipeline"
readme = "README.md"
requires-python = ">=3.11"
# Core deps are pinned. The event/ledger/sim core only needs numpy + pyyaml (+ scipy for the
# closed-world identity assignment); the vision extras pull in torch/ultralytics.
dependencies = [
    "numpy==2.4.6",
    "pyyaml==6.0.3",
    "scipy==1.17.1",
]

[project.optional-dependencies]
vision = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "ultralytics==8.4.166",
    "supervision==0.30.6",
    "opencv-python-headless==5.0.0.93",
    "lap==0.5.13",
]
export = [
    "onnx==1.23.1",
    "onnxruntime==1.30.0",
]
dev = [
    "pytest==9.1.1",
    "motmetrics==1.4.0",      # make reid-bench, make bench, the MOT16 guard in make test (bree/eval/reid_bench.py)
]
plates = [                        # fuel drive-off: make plates-bench, pytest -m vision in tests/test_plates.py
    "fast-plate-ocr==1.1.0",      # plate text reader (ONNX), MIT
    "open-image-models==0.6.0",   # plate detector (ONNX), MIT
    "onnxruntime==1.30.0",
]

[project.scripts]
bree = "bree.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "vision: needs torch/ultralytics and model weights (smoke tests)",
]
